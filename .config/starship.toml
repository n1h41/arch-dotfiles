# ~/.config/starship.toml

[username]
style_user = '190 bold'
style_root = 'black bold'
format = '[$user]($style)'
disabled = false
show_always = true
aliases = { "corpuser034g" = "matchai" }

[hostname]
ssh_only = false
format = '[$ssh_symbol](bold blue) - [$hostname](bold red) '
trim_at = '.companyname.com'
disabled = false

[cmd_duration]
min_time = 500
format = 'underwent [$duration](bold yellow)'

[kubernetes]
symbol = '☸ '
style = 'cyan bold'
format = 'on [$symbol$context]($style) \([$namespace](blink yellow)\) '
disabled = false
contexts = [
  { context_pattern = "PROD-DANGER", context_alias = "PROD ", style = "blink bold 255 bg:124", symbol = " 🚨 " },
  { context_pattern = "UAT-CLUSTER", context_alias = "UAT ", style = "bold 232 bg:green", symbol = " ⚙️ " },
]
